# The HRM API behind nginx on the VM.
#
# This file is the record of what should be on the server. Certbot edits the
# live copy to add the certificate lines, so apply changes with:
#
#   sudo cp deploy/nginx-hr-api.yourcompany.com.conf \
#           /etc/nginx/sites-available/hr-api.yourcompany.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# and let certbot re-add its lines (certbot --nginx -d hr-api.yourcompany.com)
# if the certificate block is missing afterwards.

# Do not announce the version. Knowing the exact nginx build is the first
# thing an attacker needs to match a host to a published vulnerability, and
# nobody legitimate needs it. Must sit at http{} level to take effect for
# error pages as well, so this line belongs in nginx.conf — it is repeated
# here as a reminder when this file is copied into place.
#   /etc/nginx/nginx.conf  ->  http { server_tokens off; }
server_tokens off;

server {
    listen 80;
    server_name hr-api.yourcompany.com;

    # Everything else is served over TLS; this only exists to send people there
    # and to answer the ACME challenge certbot uses to renew the certificate.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name hr-api.yourcompany.com;

    # nginx 1.24: http2 is a parameter of listen. The `http2 on;` form is
    # 1.25 and later and will fail to start here.

    client_max_body_size 25m;

    # JSON compresses extremely well and the API is a long way from its
    # users, so this is worth more here than it looks.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
