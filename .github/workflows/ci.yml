# Everything that has to be true before a change lands.
#
# The suite runs twice: once on in-memory SQLite, which is fast and catches
# logic, and once against a real PostgreSQL server, which catches what SQLite
# is too forgiving about — column types, constraint enforcement, transaction
# behaviour, and anything the migrations do that SQLite silently tolerates.
#
# A test suite that only ever meets SQLite proves the code runs on SQLite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          PYTHONPATH: .

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrm_test
        ports: ['5432:5432']
        # Without this the steps start before the server accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt

      # The migrations have to build the schema on a real server, forwards and
      # back. A migration that only ever runs forwards is a migration nobody
      # can undo at three in the morning.
      #
      # Not all the way to base: inv02 (b2c3d4e5f6a7) is deliberately
      # irreversible and says so — it folds a category enum and a free-text
      # location column into rows that cannot be told apart again, so there is
      # nothing honest to write in its downgrade. Rolling back TO that
      # revision leaves it applied and exercises everything above it, which is
      # every migration anybody is realistically going to undo.
      #
      # Below that line the answer is a backup, which is what backup.sh and
      # restore.sh are for.
      - name: Migrations apply, roll back, and re-apply
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrm_test
          SECRET_KEY: ci-only-not-a-real-secret
        run: |
          alembic upgrade head
          alembic downgrade b2c3d4e5f6a7
          alembic upgrade head

      # If a new migration is written without a working downgrade, the step
      # above starts failing and somebody has to decide whether that is
      # deliberate. This keeps the count honest in the meantime.
      - name: Only the one migration is irreversible
        working-directory: backend
        run: |
          # --include='*.py' matters: the step above ran the migrations,
          # which imported every version module and left .pyc files in
          # __pycache__. Compiled bytecode carries the names used in the
          # source, so a plain recursive grep counts inv02 twice — once as
          # source and once as bytecode. GNU grep searches those binaries;
          # BSD grep on a developer's Mac does not, so this passed locally
          # and failed in CI.
          count=$(grep -rl --include='*.py' "NotImplementedError" alembic/versions/ | wc -l)
          echo "irreversible migrations: $count"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 irreversible migration (inv02), found $count."
            echo "A new one needs a deliberate decision and a note in DEPLOYMENT.md."
            exit 1
          fi

      - name: Bootstrap a fresh deployment
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrm_test
          SECRET_KEY: ci-only-not-a-real-secret
        run: |
          echo "" | python scripts/bootstrap.py \
            --admin-email ci@example.com --admin-name "CI Admin"
          # Running it twice must change nothing.
          echo "" | python scripts/bootstrap.py \
            --admin-email ci@example.com --admin-name "CI Admin"

      - name: Test suite
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrm_test
          SECRET_KEY: ci-only-not-a-real-secret
          PYTHONPATH: .
        run: python -m pytest -q

  frontend:
    name: Portal build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit -p tsconfig.app.json
        working-directory: frontend
      - name: Build
        working-directory: frontend
        env:
          # The build refuses to run without these, which is the point of
          # them; CI proves a fresh clone can be built by someone who has
          # only read the instructions.
          VITE_API_BASE_URL: https://hr-api.example.com/api/v1
          VITE_BRAND_NAME: CI Build
          VITE_COMPANY_NAME: CI Company Limited
          VITE_COMPANY_SHORT_NAME: CI Company
        run: npm run build

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages with known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict || \
            echo "::warning::pip-audit reported findings — see the log"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: npm packages with known vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"
